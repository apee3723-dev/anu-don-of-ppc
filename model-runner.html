<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anu Don of PPC</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#394d7d,#15172c 70%);font-family:system-ui,sans-serif;color:#fff3c4;overflow:hidden}main{width:min(94vw,960px);text-align:center}h1{margin:0;letter-spacing:.12em;font-size:clamp(2rem,5vw,3.5rem);text-shadow:3px 3px #ba5738}.sub{margin:5px 0 10px;color:#b9dbe9}.hud{display:flex;justify-content:space-between;padding:6px 14px;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:900}.player{color:#ffe36c}.layout{display:grid;grid-template-columns:1fr 185px;gap:13px;align-items:start}canvas{width:100%;aspect-ratio:16/9;display:block;border:5px solid #ffcc5a;border-radius:20px;background:#273b65;box-shadow:0 15px 45px #0009;touch-action:none}.board{background:#17213f;border:2px solid #496493;border-radius:16px;padding:12px;text-align:left;min-height:190px}.board h2{font-size:1rem;margin:0 0 8px;color:#ffe36c}.board ol{margin:0;padding-left:24px;color:#e7edf5;font-size:.85rem;line-height:1.8}.board button{margin-top:10px;width:100%;border:0;border-radius:8px;background:#ffcf57;color:#2b2040;font-weight:900;padding:7px;cursor:pointer}.tip{font-size:.9rem;color:#b9dbe9}@media(max-width:650px){.layout{grid-template-columns:1fr}.board{min-height:0}.board ol{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}}</style></head>
<body><main><h1>ANU DON OF PPC</h1><p class="sub">Sprint under the savanna stars. Collect sun-orbs. Clear every barrier.</p><div class="hud"><span id="score">Score: 0</span><span class="player" id="player">Runner</span><span id="best">Best: 0</span><span id="hearts">♥ ♥ ♥</span></div><div class="layout"><canvas id="game" width="960" height="540"></canvas><aside class="board"><h2>🏆 LIVE LEADERBOARD</h2><ol id="leaders"><li>Loading scores…</li></ol><button id="change">Change name</button></aside></div><p class="tip">Space / ↑ / tap to jump · R to restart</p></main>
<script>(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),W=c.width,H=c.height,ground=431,photo=new Image();photo.src='hero-runner.png';const API='https://yamcrybukvgapxlktwcp.supabase.co/rest/v1/leaderboard',KEY='sb_publishable_2qEHTj0qbFVfvNTAlVlYYQ_2Eqhov5j';let name=localStorage.anuPlayer||'',score=0,best=+localStorage.modelRunBest||0,lives=3,playing=true,t=0,speed=5,items=[],spark=[],timer=70,saved=false;const p={x:157,y:ground-160,vy:0,on:true},sc=document.querySelector('#score'),be=document.querySelector('#best'),he=document.querySelector('#hearts'),playerEl=document.querySelector('#player'),leaders=document.querySelector('#leaders');
function askName(){let n=prompt('What is your player name?','');name=n&&n.trim()?n.trim().replace(/[^A-Za-z0-9 _-]/g,'').slice(0,14):'Runner';localStorage.anuPlayer=name;playerEl.textContent=name}if(!name)askName();else playerEl.textContent=name;document.querySelector('#change').onclick=askName;
async function renderBoard(){leaders.replaceChildren();try{let r=await fetch(API+'?select=player_name,score&order=score.desc,created_at.asc&limit=8',{headers:{apikey:KEY}});if(!r.ok)throw Error();let list=await r.json();if(!list.length){let li=document.createElement('li');li.textContent='No scores yet';leaders.append(li)}for(let row of list){let li=document.createElement('li');li.textContent=row.player_name+' — '+row.score;leaders.append(li)}}catch{let li=document.createElement('li');li.textContent='Unable to load scores';leaders.append(li)}}async function saveScore(){if(saved)return;saved=true;try{await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({player_name:name,score:Math.floor(score)})})}catch{}renderBoard()}
function hud(){let n=Math.floor(score);if(n>best){best=n;localStorage.modelRunBest=best}sc.textContent='Score: '+n;be.textContent='Best: '+best;he.textContent='♥ '.repeat(lives).trim()||'OUT'}function reset(){score=0;lives=3;playing=true;speed=5;items=[];spark=[];timer=55;saved=false;p.y=ground-160;p.vy=0;p.on=true;hud()}function jump(){if(!playing){reset();return}if(p.on){p.vy=-17;p.on=false;for(let i=0;i<8;i++)spark.push({x:p.x+25,y:ground,vx:-Math.random()*3,vy:-Math.random()*4,a:1})}}addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}if(e.code==='KeyR')reset()});c.addEventListener('pointerdown',jump);
function spawn(){let orb=Math.random()<.4;items.push({type:orb?'orb':'barrier',x:W+55,y:orb?190+Math.random()*160:ground-53,w:orb?30:55,h:orb?30:53,phase:Math.random()*8,dead:false})}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function scene(){let q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#253a75');q.addColorStop(.66,'#cd7184');q.addColorStop(.67,'#e8a957');q.addColorStop(1,'#a65b37');g.fillStyle=q;g.fillRect(0,0,W,H);g.fillStyle='#fff0ab';g.beginPath();g.arc(760,100,47,0,7);g.fill();g.fillStyle='#212b53';for(let i=0;i<15;i++){let x=(i*91-t*.24)%1100-70;g.beginPath();g.moveTo(x,ground);g.lineTo(x+35,272+(i%3)*22);g.lineTo(x+70,ground);g.fill()}g.fillStyle='#cc793e';g.fillRect(0,ground,W,H-ground);g.strokeStyle='#a95136';g.lineWidth=3;for(let i=0;i<18;i++){let x=(i*82-t*speed)%1050;g.beginPath();g.moveTo(x,ground+35+i%3*18);g.lineTo(x+36,ground+35+i%3*18);g.stroke()}}function runner(){g.save();g.translate(p.x,p.y);let bob=p.on?Math.sin(t*.28)*3:0;g.shadowColor='#181327';g.shadowBlur=9;if(photo.complete)g.drawImage(photo,-60,-20+bob,120,180);else{g.fillStyle='#fff';g.fillRect(-25,10,50,130)}g.shadowBlur=0;g.restore()}function draw(it){g.save();g.translate(it.x,it.y);if(it.type==='orb'){g.translate(0,Math.sin(t*.1+it.phase)*9);g.fillStyle='#ffe75e';g.shadowColor='#ffe75e';g.shadowBlur=16;g.beginPath();g.arc(15,15,12,0,7);g.fill();g.shadowBlur=0}else{g.fillStyle='#7c3732';g.fillRect(0,31,55,22);g.fillStyle='#efb649';for(let i=0;i<3;i++){g.beginPath();g.moveTo(i*18,31);g.lineTo(i*18+9,1);g.lineTo(i*18+18,31);g.fill()}g.fillStyle='#ffdf77';g.fillRect(0,41,55,5)}g.restore()}function loop(){requestAnimationFrame(loop);t++;scene();if(playing){speed=5+Math.min(5,score/100);if(--timer<=0){spawn();timer=Math.max(42,85-score/6)+Math.random()*25}p.vy+=.85;p.y+=p.vy;if(p.y>=ground-160){p.y=ground-160;p.vy=0;p.on=true}items.forEach(i=>{i.x-=speed;if(!i.dead&&hit({x:p.x-32,y:p.y,w:80,h:155},i)){i.dead=true;if(i.type==='orb'){score+=10;for(let j=0;j<10;j++)spark.push({x:i.x,y:i.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,a:1})}else{lives--;if(!lives){playing=false;saveScore()}}hud()}});items=items.filter(i=>i.x>-90&&!i.dead);score+=.03;hud()}items.forEach(draw);runner();spark.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.a-=.035;g.fillStyle=`rgba(255,238,151,${s.a})`;g.beginPath();g.arc(s.x,s.y,3,0,7);g.fill()});spark=spark.filter(s=>s.a>0);if(!playing){g.fillStyle='#0d1731b8';g.fillRect(0,0,W,H);g.fillStyle='#fff1bd';g.textAlign='center';g.font='900 54px system-ui';g.fillText('RUN COMPLETE',W/2,H/2-10);g.font='700 22px system-ui';g.fillText('Tap or press Space to race again',W/2,H/2+32)}}renderBoard();reset();loop()})();</script></body></html>
